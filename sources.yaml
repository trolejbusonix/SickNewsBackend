# Limits
# Per-source cap (a source can override it with `max_articles`).
max_articles_per_source: 20
# Keep this above (sources x per-source cap) so slow topics aren't pushed out by busy ones.
max_total_articles: 900

# Keyword filters: case-insensitive whole-word match on title + summary.
# exclude: drop the article if ANY keyword matches (global, category or source).
# include: if any include list (global + category + source) is non-empty, the article
#          must match at least one of them.
include_keywords: []
exclude_keywords:
  - "sponsored"

# Category names are shown as panel names in the app. Renaming one creates a new panel.
categories:
  Harry Potter: {}
  One Piece: {}
  Knicks: {}
  NBA: {}
  World: {}
  Poland: {}
  Tech: {}
  Movies & TV: {}
  Nerd & Geek: {}

# Source types:
#   rss (default)  RSS/Atom feed at `url`.
#   html           Scraped listing page at `url`. Links matching the `link_pattern` regex are
#                  articles. Each new article page is fetched once for its og: metadata (title,
#                  summary, image, publish time). Use it for sites without a usable feed.
#                  Optional: min_title_length (link text shorter than this is navigation),
#                  title_strip (regex removed from titles, e.g. a "Site | " prefix).
#
# Order matters: when two sources publish the same URL, the first one listed keeps it.
# Topic-specific categories therefore come before the broad ones (e.g. Variety's One Piece
# tag before Variety's main feed, ANN News filtered to One Piece before ANN All).
sources:
  # ---------------------------------------------------------------- Harry Potter
  - id: leaky_cauldron
    name: The Leaky Cauldron
    category: Harry Potter
    url: https://www.the-leaky-cauldron.org/feed/
  - id: wizarding_world
    name: Wizarding World
    category: Harry Potter
    type: html
    url: https://www.harrypotter.com/news
    link_pattern: ^https://www\.harrypotter\.com/news/[a-z0-9-]+$
    title_strip: '^Harry Potter \| | \| Wizarding World$'
  - id: mugglenet
    name: MuggleNet
    category: Harry Potter
    url: https://www.mugglenet.com/feed/
  - id: hp_fan_zone
    name: Harry Potter Fan Zone
    category: Harry Potter
    url: https://www.harrypotterfanzone.com/feed/
  - id: cbr_hp
    name: CBR
    category: Harry Potter
    url: https://www.cbr.com/feed/tag/harry-potter/
  - id: guardian_hp
    name: The Guardian
    category: Harry Potter
    url: https://www.theguardian.com/film/harrypotter/rss
  - id: gnews_hp
    name: Google News
    category: Harry Potter
    url: https://news.google.com/rss/search?q=%22Harry+Potter%22+OR+%22Hogwarts%22&hl=en-US&gl=US&ceid=US:en

  # ---------------------------------------------------------------- One Piece
